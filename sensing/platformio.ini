; PlatformIO config — Sensing Layer ESP node
; Indoor/outdoor sensors, energy meter, publishes to MQTT broker on Raspberry Pi

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0
    adafruit/Adafruit Unified Sensor @ ^1.1
    adafruit/DHT sensor library @ ^1.4
    adafruit/Adafruit BMP280 Library @ ^2.6
    adafruit/Adafruit TSL2561 @ ^1.1
    4-20ma/ModbusMaster @ ^2.0.1 ; RS485 Modbus RTU — HLS-SI solar irradiance, HLS-DTAS air velocity sensors
