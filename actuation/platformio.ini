; PlatformIO config — Actuation Layer ESP node
; Drives AC setpoint relay/IR and per-zone lighting PWM, subscribes to control commands over MQTT

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0
    crankyoldgit/IRremoteESP8266 @ ^2.8
